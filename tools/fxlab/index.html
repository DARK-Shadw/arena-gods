<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FX Lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root { --bg: #0e0f12; --panel: #17191d; --line: #2a2d33; --ink: #e6e6e6; --dim: #8f959e; --acc: #f0a050; --plan: #6a6f78; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
      #app { display: grid; grid-template-columns: 340px 1fr; height: 100%; }
      #side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
      #side .row { display: flex; gap: 6px; align-items: center; padding: 5px 10px; }
      #side .row label { color: var(--dim); min-width: 52px; }
      #side select, #side input[type=text], #side input[type=number] { flex: 1; min-width: 0; background: #0d0e11; color: var(--ink); border: 1px solid var(--line); padding: 4px 6px; border-radius: 4px; font: inherit; }
      #list { flex: 1; overflow: auto; border-top: 1px solid var(--line); }
      #list .grp { color: var(--acc); padding: 8px 10px 2px; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
      #list .it { padding: 2px 10px 2px 16px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
      #list .it small { color: var(--dim); margin-left: 6px; }
      #list .it.plan { color: var(--plan); }
      #list .it:hover { background: #22252a; }
      #list .it.sel { background: #3a2c1c; color: var(--acc); }
      #main { position: relative; min-width: 0; }
      #c { width: 100%; height: 100%; display: block; }
      #hud { position: absolute; left: 10px; top: 8px; pointer-events: none; white-space: pre; font: 12px/1.4 ui-monospace, monospace; color: #d8d8d8; text-shadow: 0 1px 2px #000; }
      #desc { position: absolute; right: 10px; top: 8px; max-width: 420px; pointer-events: none; white-space: pre-wrap; font-size: 12px; color: #cfcfcf; text-shadow: 0 1px 2px #000; text-align: right; }
      #bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(14,15,18,.9); border-top: 1px solid var(--line); }
      #scrub { width: 100%; }
      #ctl { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
      button, .chk, #ctl select { background: #22252a; color: var(--ink); border: 1px solid var(--line); padding: 3px 9px; border-radius: 4px; cursor: pointer; font: inherit; }
      button:hover { border-color: #555; }
      label.chk input { vertical-align: -2px; }
      .help { color: var(--dim); font-size: 11px; padding: 6px 10px; border-top: 1px solid var(--line); }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="side">
        <div class="row"><b style="color:var(--acc)">FX LAB</b><span id="fmt" style="color:var(--dim);margin-left:auto"></span></div>
        <div class="row"><input id="q" type="text" placeholder="filter… (id, catalog id, description)" /></div>
        <div class="row"><label>seed</label><input id="seed" type="number" value="1" /><button id="reseed" title="new seed">⟳</button></div>
        <div class="row"><label>quality</label><select id="qual"><option value="0">low (q0)</option><option value="1">medium (q1)</option><option value="2" selected>high (q2)</option></select></div>
        <div class="row"><label>gore</label><select id="gore"><option value="off">off (clean)</option><option value="standard">standard</option><option value="full">full</option></select></div>
        <div class="row"><label>light</label><select id="bg"><option value="dark">dark arena</option><option value="torch">torchlight</option><option value="neutral">neutral grey</option></select></div>
        <div class="row"><label class="chk"><input type="checkbox" id="dummies" checked /> dummies</label><label class="chk"><input type="checkbox" id="brazier" /> brazier</label><label class="chk"><input type="checkbox" id="mvOn" checked /> mv blend</label></div>
        <div id="list"></div>
        <div class="help">Click an effect to spawn it. Space play/pause · , . step 1/60 s · L loop · S screenshot. Grey rows are catalog effects not built yet (shown with their nearest preview). Console: <code>__fxlab.list() / play(id,{seed,q,gore}) / at(t) / stats() / sheet(id,[t…])</code></div>
      </div>
      <div id="main">
        <canvas id="c"></canvas>
        <div id="hud"></div>
        <div id="desc"></div>
        <div id="bar">
          <input id="scrub" type="range" min="0" max="1000" value="0" />
          <div id="ctl">
            <button id="play">▶ / ❚❚</button>
            <button id="restart">⟲ restart</button>
            <button id="prev">◀ 1/60</button>
            <button id="next">1/60 ▶</button>
            <span>speed <select id="spd"><option>0.05</option><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option></select></span>
            <label class="chk"><input type="checkbox" id="loop" checked /> loop</label>
            <button id="shot">📷 screenshot</button>
            <span id="info" style="color:var(--dim)"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./lab.ts"></script>
  </body>
</html>
